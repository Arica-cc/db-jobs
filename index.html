*{box-sizing:border-box;}
body{

::selection{ background:var(--accent-soft); color:var(--accent-ink); }

.wrap{ max-width:720px; margin:0 auto; }

.hero{

.stats{

.search-bar{

. 负责日常风险监控工作，实时跟踪投注数据及账户行为，及时识别异常；\n2. 撰写风险监控日志及风险事件分析报告，定期向管理层汇报风险状况；\n3. 通过数据分析手段排查可疑账户、违规及套利行为，并跟踪风控措施效果，提出优化建议；\n4. 针对突发风险事件快速响应、妥善处置，并完成事后复盘总结；\n5. 协助培训新入职或初级风控人员，指导其掌握风险监控流程及分析方法。\n6.熟悉异常标签逻辑场景\n\n任职要求：\n1. 大学本科及以上学历，3年及以上iGaming行业相关工作经验，熟悉体育业务逻辑；\n2. 数据敏感度高，具备扎实的逻辑分析能力，能够在高压环境下快速应对突发事件；\n3. 熟练使用Excel等数据分析工具，能够从海量数据中精准识别异常数据及可疑行为；\n4. 具备良好的书面表达能力及跨部门沟通协调能力；\n5. 具备较强的责任心与抗压能力，并有一定的团队指导/培训经验或意愿。\n6.必须要有资深风控相关经验3年以上", "cat": "风控与数据"}, {"id": "13", "title": "AIGC 短视频全能设计师（导演思维/构图美学/开源+闭源双轨）AI Video Creative Specialist / Pipeline Engineer", "salary": "25-50k", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n1、独立导演与全流程产出： 具备成熟的导演思维。负责短视频从0到1的商业化闭环创作，独立完成剧本杀手稿、分镜剧作（Storyboard）、视听语言规划、Prompt撰写，到AI视频生成、后期精剪与音效配乐合成的一条龙工作。\n2、镜头语言与构图把控（核心）： 负责把控全片的美术调性与分镜构图。拒绝盲盒式抽卡，必须通过精准的提示词与控制工具，实现黄金分割、三等分、对称、低角度仰拍（展现史诗感）、深景深（展现空间层次）等专业电影级构图，确保画面具备高级的视觉张力。\n3、开源与闭源双轨管线应用： 根据项目时效和精度要求，合理组合使用开源与闭源工具。\n在需要极致控图（如角色不穿帮、特定道具如三叉戟精准还原、统一 Rim Light 边缘光）的环节： 熟练使用 ComfyUI 进行高精准度量产。\n在需要大场面、复杂物理动力学（如水龙卷、海浪破碎）的环节： 负责使用闭源商业模型进行高效率视觉破局。\n4、分镜与角色一致性控制： 攻克 AI 视频核心痛点，利用开源插件（ControlNet等）和闭源特色功能，确保短视频多镜头切换时，主角人物、核心道具、场景风格绝对统一。\n5、视听包装与画质修复： 对 AI 生成的原始素材进行二次精修包装。熟练运用传统剪辑、特效软件进行视频局部重绘修瑕、画质超分辨率放大、转场卡点及音效配乐的最终渲染。\n\n任职要求：\n1. 核心硬性条件：导演思维与电影级构图能力（关键升级）\n导演/分镜功底： 具备良好的视听语言逻辑与叙事能力。懂得如何利用镜头运动（Pan/Zoom/Rack Focus轴向变焦）来引导玩家视线，熟悉短视频的“黄金3秒定律”与情绪起伏节奏（什么时候该沉静留白，什么时候该高潮爆发）。\n高级构图美学： 扎实的美术基本功。对画面中的点线面构成、强烈的冷暖色调对比、全局光源与边缘环境光（Rim Light）的统一性有极高敏感度。作品集需展现出强烈的空间体量感与财富感，绝无素材拼接的廉价感。\n2. 开源与闭源模型的综合驾驭能力\n精通开源生态： 必须具备成熟的 ComfyUI 或 Stable Diffusion WebUI 熟练度。能搭建并优化包含 ControlNet、IP-Adapter、AnimateDiff、Flux、SVD、Wan2.1 等开源节点的工作流，利用 3D 资产/深度图进行精准视频渲染。\n熟练闭源生态： 熟练使用 Kling（可灵）、Runway (Gen-3)、Sora、Luma、Midjourney 等主流闭源商业大模型，能够最大化利用闭源模型的动态质感与泛化能力。\n3. 后期精剪与视听卡点能力\n后期软件： 熟练掌握 After Effects (AE)、Premiere (PR) 或 剪映专业版。\n音画同步： 具备良好的音频处理能力。能将 BGM、环境音效（如爆炸、撞击、流水声）与 AI 视频的画面节奏进行精准卡点融合，制造听觉与视觉的双重爽感。\n4. 优先加分项\n有本地服务器部署经验，或懂得如何配合技术团队在云端优化 GPU 算力成本者优先。\n熟悉 Suno / Udio 等 AI 音乐工具，能利用 AI 自制高契合度视频配乐者优先。\n具备 3D 软件（Blender / C4D）基础，能出白模/深度图（Depth）来指导开源 AI 视频生成者优先。", "cat": "设计与美术"}, {"id": "14", "title": "美术总监", "salary": "60-100k", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n（没做过游戏请不要投）\n1、根据游戏世界观，独立负责确立游戏角色.场景的设计需求；\n2、把控游戏整体游戏风格，管理美术团队，负责美术人员的技术能力提升;\n3、负责确立美术制作标准，把控品质.进度.成本预算。\n4、为项目制定产品美术风格，制作模式，增加美术趣味性；进行质量审核，整合游戏资源；\n\n任职要求：\n（不限国籍，提供作品地址）\n1、有7年以上游戏行业从业经验；有至少2款上线游戏的主美经验；\n2、较好的美术专业能力，较高的审美能力，精通游戏美术各类资源开发流程和规范（包括原画和3d）；\n3、美术相关专业背景，有深厚的角色.场景原画设计基础；\n4、有较好的色彩和造型基础，想象力丰富；\n5、善于交流，富有团队协作精神，与团队中各部门保持较好沟通协作状态，有强烈责任心，对待工作认真负责，能够主动承受工作压力，能够主动改善工作产出；\n6、能适应各种游戏风格。\n7、有大厂工作经验优先", "cat": "设计与美术"}, {"id": "15", "title": "商务总监", "salary": "60k起", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n岗位名称：商务拓展总监（游戏行业）\n薪资待遇：保底 5000U + 高额佣金 / 分成（根据资源质量及业务体量可灵活协商）\n岗位职责\n1. 负责公司多产品线的商务拓展与合作落地，包括老虎机、真人娱乐、体育博彩、彩票及电竞等业务板块。\n2. 依托自身行业资源，直接对接商户、平台及各类渠道合作伙伴，推动高效上线与合作转化。\n3. 主导商务谈判及合作模式设计，包括佣金比例、分成机制、结算方式及合同条款，提升长期合作价值。\n4. 深度维护核心客户关系，持续拓展优质合作网络，推动业务规模与收入增长。\n5. 与运营、产品、技术及风控等团队紧密协作，确保项目顺利推进及合作伙伴长期稳定发展。\n\n1. Lead end-to-end business development and partnership execution across multiple product lines, including Slots, Live Casino, Sportsbook, Lottery, and Esports.\n2. Leverage existing industry resources to directly connect with merchants, platforms, and channel partners, driving fast onboarding and conversion.\n3. Own commercial negotiations and partnership structures, including commission models, revenue share, settlement terms, and contract agreements, to maximize long-term value.\n4. Develop and manage key accounts, continuously expand the partner network, and drive sustainable revenue growth.\n5. Collaborate cross-functionally with Operations, Product, Tech, and Risk teams to ensure smooth delivery and long-term partner success.\n\n任职要求：\n1. 具备游戏或 iGaming 行业商务拓展或相关商业岗位经验，有成功案例者优先。\n2. 拥有成熟且可快速落地的商户 / 平台 / 渠道资源，并具备实际转化能力。\n3. 熟悉行业合作模式、分成结构及商务谈判逻辑。\n4. 具备优秀的独立谈判能力与资源整合能力，执行力强。\n5. 具备中英双语沟通能力（如资源能力突出，可适当豁免该要求）。\n6. 国籍不限。\n\n1. Proven experience in gaming / iGaming business development or related commercial roles, with a strong track record preferred.\n2. Existing, ready-to-activate merchant / platform / channel resources with clear execution capability.\n3. Strong understanding of industry partnership models, deal structures, and commercial frameworks.\n4. Independent negotiator with strong resource integration and execution skills.\n5. Bilingual in Chinese and English is preferred; this requirement may be waived for candidates with exceptional resources and proven deal-making ability.\n6. Nationality is not restricted.", "cat": "商务与品牌"}, {"id": "16", "title": "高级商务招商专员（B2B / 战略合作）", "salary": "15k+提成", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n🚀 职位核心价值\n\n这不是一份平庸的打工职位，而是一个资源套利与财富增长的直通车。\n我们寻找的是拥有行业沉淀、手握核心资源、且不甘于死工资的顶级猎手。\n你将负责公司核心产品（包网 / API / 接口）的全球招商，直接对话行业核心玩家，撬动高价值合作与长期收益。\n\n⸻\n\n🛠️ 岗位职责\n\t1.\t资源变现与业务破局\n激活并转化现有 B 端客户资源（如大型代理、包网商、流量主等），快速打开市场，实现业绩突破。\n\t2.\t全流程商务拓展\n负责从线索开发、商务洽谈、方案定制到合同签署的完整招商流程，推动高质量合作落地。\n\t3.\t核心客户经营\n深度维护重点合作伙伴关系，建立长期稳定的合作机制，提升复购率与转介绍转化。\n\t4.\t市场洞察与策略反馈\n敏锐捕捉行业趋势与竞争动态，及时反馈对手招商政策，协助优化公司分成模型与合作策略，持续提升市场竞争力。\n\n任职要求：\n1.\t行业资历\n具备 2-3 年以上博彩（iGaming）/ 支付 / 包网行业 B 端商务经验，对行业生态及商业模式有深刻理解。\n\t2.\t资源储备（核心硬性）\n手头拥有一定规模的 B 端客户资源、渠道代理或上下游产业链资源，能够快速启动业务并实现转化。\n\t3.\t商务谈判能力\n具备卓越的商务谈判与公关能力，能够独立拆解复杂利益结构，推动合作高效达成。\n\t4.\t语言能力\n中文表达能力强；如具备英语、葡语或西语等第二语言能力，可拓展海外市场者优先。\n\t5.\t结果导向与驱动力\n具备强烈结果导向，适应高压环境，对业绩与财富增长有强烈追求与执行力。\n\n⸻\n\n💰 薪酬福利：行业天花板级\n\t1.\t高保障底薪\n提供行业内极具竞争力的底薪保障，确保稳定基础收入。\n\t2.\t合伙人级提成机制\n提成比例极具吸引力，最高可享受“股东级”分红激励。收入与业绩强绑定，上不封顶。\n\t3.\t极速结佣体系\n完善且高效的结佣机制，确保收益快速兑现，提升资金周转效率。\n\t4.\t快速晋升通道\n业绩表现优异者，可快速晋升为商务总监或区域合伙人，进入核心决策层。", "cat": "商务与品牌"}, {"id": "17", "title": "高级老虎机游戏策划", "salary": "25k-50k", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：中国/台湾\n工作时长：常白班\n\n岗位职责：\n岗位核心需求： 负责Slots游戏设计、主题、核心玩法、表现设计。\n1、负责设计老虎机的核心玩法和特色玩法，包括滚轴逻辑、连线规则、触发机制等。\n2、结合市场热门题材（如欧美神话、亚洲风、水果机等）制定美术需求，把控游戏整体视听风格。\n3、深入了解欧美或东南亚Slots市场趋势，针对不同地区玩家偏好设计游戏节奏。\n4、有一定数学与表现结合经验，理解数值策划提供的数学模型（如波动性 Volatility），并将其转化为引人入胜的美术表现和音效反馈（Big Win, Mega Win的表现力）。\n\n任职要求：\n1、行业经验： 必须有3年以上老虎机（Slots）类游戏机制项目经验，至少独立策划过10款以上老虎机游戏产品。\n2、创意能力： 脑洞大，能设计出创新的Bonus玩法，同时具备良好的审美能力。\n3、数值理解： 虽然不一定要求亲自算数值，但必须理解RTP、波动性、命中率等概念对游戏体验的影响。\n4、在知名老虎机厂商任职过的优先；\n5、有英语读写能力者优先，能研究海外竞品。", "cat": "产品与策划"}, {"id": "18", "title": "棋牌/捕鱼数值策划", "salary": "30-50k", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：中国/台湾\n工作时长：常白班\n\n岗位职责：\n1、岗位核心： 负责游戏数值系统的平衡、概率模型搭建，直接对游戏的RTP（玩家回报率）负责。\n2、数值模型搭建： 负责棋牌（如德州、斗地主、麻将）或捕鱼类游戏的底层数值框架搭建，包括概率计算、赔率设定、RTP（返奖率）控制。\n3、了解游戏风控体系，需根据项目需求，设计游戏风控逻辑；\n4、体验调优： 针对捕鱼游戏，调整不同炮倍、鱼种的击杀概率与碰撞逻辑；针对棋牌，优化匹配算法和AI逻辑，平衡玩家的“爽感”与挫败感。\n5、数据分析： 监控线上运营数据，根据数据反馈反推数值问题并进行动态调整。\n\n任职要求：\n1、本科及以上学历，数学、统计学、计算机等理工科专业优先。\n2、专业技能： 精通Excel（函数、VBA），能熟练使用Matlab或Python进行模拟验算者加分。\n3、项目经验： 具有3年以上棋牌或捕鱼类游戏数值策划经验，有成功上线项目且营收数据良好者优先。\n4、核心能力： 对概率论、博弈论有深刻理解，对数字极度敏感，了解博彩心理学。", "cat": "产品与策划"}, {"id": "19", "title": "游戏产品副总监", "salary": "50-80k", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n1.\t产品规划与落地执行\n负责公司核心游戏产品（包括老虎机、棋牌等娱乐化游戏）的整体规划与落地执行，确保产品从概念到上线的高质量交付。\n\t2.\t团队建设与管理\n主导产品团队建设与管理，包括目标制定、任务分配、绩效考核及人才培养，提升团队整体效率与协作能力。\n\t3.\t产品策略与用户增长\n深入洞察市场及用户需求，制定产品策略，优化游戏体验，提高用户留存及付费转化。\n\t4.\t跨部门协作与项目推进\n协调研发、运营、数据、市场等多部门资源，推动项目按计划上线并持续优化。\n\t5.\t流程与工具优化\n建立和完善产品开发流程、标准及管理工具应用，提升团队执行效率与规范化水平。\n\n任职要求：\n1.\t教育背景与经验\n本科及以上学历，5年以上大型游戏项目产品管理经验，有成熟项目落地经验者优先。\n\t2.\t行业与产品理解\n熟悉老虎机、棋牌及其他娱乐化游戏产品，对游戏玩法、用户心理及运营策略有深入理解。\n\t3.\t团队管理能力\n具备丰富的团队管理经验，能够有效激励团队成员，优化团队结构及工作流程。\n\t4.\t工具与执行能力\n熟练使用项目管理及协作工具（如JIRA、Confluence、Trello、Miro等），能够通过工具提升团队执行力。\n\t5.\t数据分析与决策能力\n具备较强的数据分析能力和逻辑思维能力，能够基于数据驱动产品优化与决策。\n\t6.\t沟通与抗压能力\n具备优秀的沟通协调能力、抗压能力及跨部门协作能力，能够推动复杂项目顺利落地。\n\n加分项：\n\n有成功上线娱乐化游戏（老虎机、棋牌等）的完整产品案例。\n熟悉敏捷开发流程和精益产品管理方法。", "cat": "产品与策划"}, {"id": "20", "title": "B端运营副总监", "salary": "60k起", "location": "可远程（仅限中国以外的地区）", "jd": "国籍要求：不限\n工作时长：常白班\n\n岗位职责：\n1.\t负责公司B端业务的整体运营管理，制定并推动业务战略与执行计划，实现营收与利润目标。\n\t2.\t深入理解亚洲博彩市场及各类合作伙伴需求，优化B端产品服务方案，提高合作满意度与业务粘性。\n\t3.\t主导渠道拓展与关键客户管理，建立长期稳定的合作关系。\n\t4.\t分析业务数据，监控运营指标，优化资源配置及流程效率。\n\t5.\t协调跨部门团队（技术、风控、市场等），确保项目落地及运营顺畅。\n\t6.\t关注行业政策法规及市场动态，及时调整运营策略以规避风险。\n\t7.\t领导团队建设与人才培养，提升整体运营能力及专业水平。\n\n任职要求：\n1.\t本科及以上学历，管理、金融、统计、计算机或相关专业优先。\n\t2.\t5年以上博彩行业B端运营或渠道管理经验，至少2年以上团队管理经验。\n\t3.\t熟悉亚洲各主要博彩市场（如澳门、菲律宾、越南、印尼等）业务特点及监管环境。\n\t4.\t深入理解B端客户需求，包括平台运营商、代理商及合作伙伴模式。\n\t5.\t熟悉运营管理、数据分析、商业模式优化及风险控制方法。\n\t6.\t具备良好的战略思维、市场洞察力、商务谈判能力及跨部门协调能力。\n\t7.\t具备强烈的目标导向和执行力，能够在快速变化的环境中推进业务增长。\n\t8.\t英语流利，掌握其他亚洲语言（如中文、越南语、印尼语）优先。", "cat": "运营与客服"}, {"id": "21", "title": "品牌经理", "salary": "20-35k", "location": "不可远程（试用期需到指定国家待集中）", "jd": "国籍要求：非中藉优先\n工作时长：常白班\n\n岗位职责：\n1.市场与竞品调研：负责竞品调研、市场调研及用户调研，分析用户特征和B端客户需求，准确提炼产品卖点，定位目标人群，制定棋牌和老虎机游戏的整体品牌定位、营销策略及运营策略。\n2.广告创意与营销策划：负责公司游戏的广告营销创意，策划并执行重点产品的大型推广活动，确保活动符合品牌形象并能吸引客户。\n3.竞品方案分析与总结：定期收集并整理竞品游戏的营销方案，按时提交部门的各项工作计划、总结及分析报告，为产品优化和市场策略提供参考。\n4.推广主题与素材创意：根据产品营销策略，策划各阶段推广主题，监督并跟进营销素材（如官网、卖点图、宣传视频、病毒素材等）的制作，确保其符合产品定位。\n5.多部门协作：协调产品、商务、美术及其他相关部门的合作，整合资源，管理项目营销进度，确保执行进度和质量，推动品牌传播和市场推广目标的实现。\n6.团队建设与管理：关注团队成长，带动团队专业能力沉淀，持续招募和培养游戏营销人才，打造高效能营销团队。\n7.数据分析与策略调整：定期监测市场动态和竞争对手策略，分析推广数据，灵活调整营销策略，为品牌决策提供数据支持。\n\n任职要求：\n1.5年以上游戏行业市场营销工作经验，有棋牌或老虎机类游戏领域的经验优先。\n2.丰富的整合营销操盘经验，熟悉B端客户需求及推广策略，有成功的游戏项目营销推广经验者优先。\n3.擅长数据分析和数据呈现，能根据数据制定并优化营销推广策略。\n4.性格开朗，自我驱动能力强，具备较强的全局观、抗压能力及沟通协调能力。\n5.熟悉B端游戏产品营销、媒介、公关、渠道等各模块工作内容，具备优秀的文案能力和创意思维。\n6.文字表达能力强，具有较强的策略思维、逻辑分析能力和总结沉淀能力。", "cat": "商务与品牌"}, {"id": "22", "title": "运营专员", "salary": "16-20k", "location": "不可远程（试用期需到指定国家待集中）", "jd": "国籍要求：台湾/马来西亚\n工作时长：配合运营部门排班\n\n岗位职责：\n1. 日常运营数据观察和分，及时发现问题并提出优化建议；\n2. 平台对接与沟通：作为项目与C端平台的桥梁，深入了解平台需求，协助推动合作落地；\n3. 活动策划与执行：结合平台特点和用户习惯，设计有吸引力的活动方案，提升产品运营数据和用户留存；\n4. 竞品调研与分析：关注行业动态，研究竞品的产品优势、运营模式和推广策略，形成有价值的分析报告；\n5. 产品优化建议：基于数据和用户反馈，协助研发团队提出老虎机产品优化方案，提升产品竞争力；\n6. 市场推广支持：协助平台制定推广计划，提供创意支持，优化宣传效果。\n\n任职要求：\n1. 至少2年以上运营相关经验，熟悉线上老虎机业务优先；\n2. 善于跨部门协作，具备优秀的沟通和协调能力，能够高效对接C端平台；\n3. 活动策划能力：熟悉平台的推广、宣传和活动运营模式，能够根据用户需求策划有吸引力的活动；\n4. 用户洞察力：了解用户的喜好和需求，能够站在用户角度提出产品优化建议；\n5. 学习能力：对行业动态和市场趋势保持敏感，能够快速学习并适应新环境；", "cat": "运营与客服"}, {"id": "23", "title": "菲籍管理外籍组长/专员", "salary": "10K-12K RMB", "location": "菲律宾（卡加延）｜不可远程", "jd": "国籍要求：马来西亚/菲华\n工作时长：常白班\n\n岗位职责：\n1.协助上级：支持人力资源主管执行日常管理任务，确保人力资源政策和程序的顺利实施。\n2.员工入职和离职管理：管理新员工的入职手续、进行入职培训以及安排离职面谈，确保员工入职和离职流程的合规和顺畅。\n3.培训与发展：组织和协调员工培训，跟进员工的技能提升和职业发展计划，确保符合公司需求和发展目标。\n4.绩效管理：协助管理和监督员工的绩效考核流程，支持主管及员工制定和实现绩效目标。\n5.员工关系和沟通：处理员工投诉和问题，确保良好的工作环境，促进员工的积极参与和满意度。\n6. 政策合规：确保公司的人力资源政策、劳动法规和相关法律法规的合规性，减少法律风险。\n7.数据管理和报告：维护和管理员工数据、薪酬福利信息和考勤记录，生成相关人力资源报告供管理层参考。\n8.劳动合同和政策文件：准备和管理劳动合同、岗位描述、员工手册等文件，确保文件的准确性和及时性。\n9.支持其他人力资源活动：根据需要参与和支持其他人力资源项目和活动，协助提升团队绩效。\n\n任职要求：\n1. 拥有人力资源专业的学士学位，或具备等同的人力资源相关经验\n2. 至少有3年在大型企业中从事人力资源工作的经验\n3. 拥有菲籍人力资源管理经验\n4. 熟悉人力资源政策和实践\n5. 能够在多系统中解读和审查大量数据\n6. 能够研究、理解并沟通复杂且有时繁琐的劳动法律\n7. 具备出色的组织能力，能够同时处理多项任务\n8.具备优秀的中英书面和沟通能力以及人际交往能力，需要具备非常强的英文书面及口语能力，以便与菲律宾的当地律师进行沟通", "cat": "人事行政与法务"}, {"id": "24", "title": "HR Staff", "salary": "21K", "location": "Philippines（Cagayan）｜不可远程", "jd": "国籍要求：Filipino\n工作时长：常白班\n\n岗位职责：\n1. Issuing offers, collecting onboarding documents, and conducting background checks for candidates.\n2. Managing end-to-end processes for employee onboarding, offboarding, and regularization.\n3. Maintaining employee E201 files, issuing employee ID cards, and managing the Office Automation (OA) system.\n4. Coordinating and supporting onboarding training sessions in collaboration with relevant HR teams.\n5. Assisting employees in setting up payroll accounts and applying for ATM cards.\n6. Issuing warning letters, handling employee terminations, and attending DOLE (Department of Labor and Employment) hearings as needed.\n7. Preparing monthly summaries of mandatory government contributions for all departments (including SSS, PhilHealth, and Pag-IBIG); registering new hires and removing resigned employees from the respective systems; submitting and managing maternity and sick leave benefit applications via the official SSS portal to ensure complete documentation, timely submission, and continuous follow-up.\n8. Updating the employee masterlist and syncing it with both the accounting firm and payroll department; coordinating with both to confirm final salary payments for resigned employees.\n9. Compiling and updating data on offer issuances and cancellations, and reporting to the recruitment team.\n10. Tracking and updating employee violations, and sharing relevant information with the recruitment team and concerned departments.\n\n任职要求：\n1.A college degree or higher in Human Resources，or equivalent experience in HR\n2.Minimum of 2-3 years’ experience working HR in a mid-sized organization\n3.Non-gambling company work experience\n2.Proven work experience as an Employee Relations Specialist or similar role\n4.Demonstrated knowledge of employment law\n5.Outstanding interpersonal skills\n6.Exceptional written and verbal communication\n7.Excellent organizational skills and attention to detail\n8.Strong problem-solving ability\n9.Relevant training and/or certifications as an Employee Relations Specialist", "cat": "人事行政与法务"}, {"id": "25", "title": "签证专员", "salary": "10转12k RMB\n11转13k RMB", "location": "泰国｜不可远程", "jd": "国籍要求：马来西亚/台湾/越南\n工作时长：常白班\n\n岗位职责：\n1、负责员工日常护保管，领用、收回等日常处理；\n2、负责员工各国签证类业务对接、办理，及保关按排等；\n3、负责员工签证类业务费用申请备用金、冲销等账务处理；\n4、负责员工护照签证人事档案信息库的建立、维护更新及日常数据统计；\n5、负责员工签证类业务费用的使用及台账建立、维护更新；\n6、负责其它岗位内的工作及领导交办的事项。\n\n任职要求：\n1、大专及以上学历，中文听说读写必须熟练，英文基础沟通；\n2、做事细致、认真、仔细（重要），有人事、签证类相关经验者优先；\n3、具备一定的沟通、协调能力，无BC背景者优先；\n4、接人待物耐心、亲和力较强；\n5、具备相关的数据整理统计、分析能力；\n6、OFFICE使用熟练。", "cat": "人事行政与法务"}, {"id": "26", "title": "HRBP组长", "salary": "15-20k", "location": "泰国｜不可远程", "jd": "国籍要求：非中籍\n工作时长：常白班\n\n岗位职责：\n1. 与业务团队合作，理解运营需求，在绩效管理、员工关系与员工敬业度等方面提供 HR 支持。\n2. 执行并支持 HR 项目，包括入职、培训、员工敬业度及发展类项目。\n3. 协助落地绩效管理与反馈机制，推动持续改进与责任担当。\n4. 支持人才管理工作，包括职业发展沟通与继任计划流程。\n5. 参与员工敬业度活动，协助维护强大、包容的企业文化。\n6. 提供数据驱动的洞察与报表，支持人力规划、留任与人才发展相关决策。\n7. 与跨职能 HR 团队协作，确保各地政策、项目与员工体验的一致性。\n8. 作为员工联络窗口，及时处理并解决各类 HR 咨询与问题。\n\n任职要求：\n要求本科\n1. 2–5 年人力资源相关经验，优先考虑快节奏或技术驱动环境（游戏、科技或互联网行业更佳）。\n2. 熟悉核心 HR 模块，包括员工敬业度、绩效管理与人才发展。\n3. 行动力强、积极主动，能同时胜任战略与运营类 HR 工作。\n4. 具备优秀的人际沟通能力，能在跨团队、跨文化环境中建立信任并有效沟通。\n5. 善于协作，能够在动态变化的环境中成长与发挥。\n6. 英语与中文流利；掌握其他亚洲语言者加分。\n7. 适应性强，能根据需要在亚洲范围内出差。", "cat": "人事行政与法务"}, {"id": function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeRegex(s){
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function highlight(escapedText, q){
  if (!q) return escapedText;
  const re = new RegExp('(' + escapeRegex(q) + ')', 'ig');
  return escapedText.replace(re, '<mark>$1</mark>');
}

    btn.addEventListener('click', () => {
      const id = btn.getAttribute('data-id');
      const job = JOBS.find(j => String(j.id) === String(id));
      if (!job) return;
      const parts = [job.title];
      if (job.salary) parts.push(job.salary);
      if (job.location) parts.push('📍 ' + job.location);
      parts.push('');
      parts.push(job.jd);
      const text = parts.join('\n');
      copyText(text, btn);
    });
  });
}

function copyText(text, btn){
  const showCopied = () => {
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = '✓ 已复制';
    btn.classList.add('copied');
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => fallbackCopy(text, showCopied));
  } else {
    fallbackCopy(text, showCopied);
  }
}

function fallbackCopy(text, onDone){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try { document.execCommand('copy'); onDone(); } catch(e) {}
  document.body.removeChild(ta);
}

document.getElementById('searchInput').addEventListener('input', render);

renderChips();
render();
</script>
